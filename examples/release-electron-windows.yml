# Example release pipeline for an Electron app built for Windows
# (peyangu/security-ci). Nothing is built, let alone published, unless the full
# security gate passes on the exact tagged commit. Ship only the artifacts this
# workflow attaches to the draft release. Copy it to .github/workflows/release.yml
# and adjust the build job (scripts/install.mjs --release does this for you).
name: release

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag must point at a commit on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main — release only reviewed code"
            exit 1
          fi
      - name: Tag must match package.json version
        run: |
          want="v$(node -p 'require("./package.json").version')"
          [ "$GITHUB_REF_NAME" = "$want" ] || { echo "::error::tag $GITHUB_REF_NAME != package.json $want"; exit 1; }

  security:
    needs: preflight
    uses: peyangu/security-ci/.github/workflows/reusable-security-scan.yml@__SECURITY_CI_REF__
    with:
      mode: full
      fail-on: high
      toolkit-repository: peyangu/security-ci
      toolkit-ref: __SECURITY_CI_REF__
    permissions:
      contents: read
      security-events: write

  build:
    needs: security
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          # never restore a cache in a release build: any branch's run can write one
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - run: npm run electron:compile
      - run: npx electron-builder --win --publish never
      - name: Checksums
        shell: bash
        run: cd release && sha256sum *.exe > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows
          path: |
            release/*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-windows
          path: dist
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes "Built by run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID after the security gate passed."
